services:
  db:
    image: postgres:16-alpine
    container_name: judge0-db
    env_file: judge0.env
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    networks:
      - judge0-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: judge0-redis
    command: --save "" --appendonly no
    volumes:
      - judge0-redis-data:/data
    networks:
      - judge0-network
    restart: unless-stopped

  server:
    image: judge0/judge0:1.13.1
    container_name: judge0-server
    ports:
      - "2358:2358"
    privileged: true
    env_file: judge0.env
    environment:
      JUDGE0_SERVICE_NAME: server
      DATABASE_URL: postgres://judge0:judge0_pass@db:5432/judge0
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAX_MAX_PROCESSES_AND_OR_THREADS: "300"
      JAVA_TOOL_OPTIONS: "-Xmx64m -Xms16m -Xss256k -XX:MaxMetaspaceSize=48m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:CICompilerCount=2 -XX:ParallelGCThreads=1 -XX:ConcGCThreads=1"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - judge0-server-data:/tmp
      - ./isolate_job.rb:/api/app/jobs/isolate_job.rb
    networks:
      - judge0-network
    restart: unless-stopped

  workers:
    image: judge0/judge0:1.13.1
    container_name: judge0-workers
    command: ["/api/scripts/workers"]
    privileged: true
    env_file: judge0.env
    environment:
      JUDGE0_SERVICE_NAME: workers
      DATABASE_URL: postgres://judge0:judge0_pass@db:5432/judge0
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAX_MAX_PROCESSES_AND_OR_THREADS: "300"
      JAVA_TOOL_OPTIONS: "-Xmx64m -Xms16m -Xss256k -XX:MaxMetaspaceSize=48m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:CICompilerCount=2 -XX:ParallelGCThreads=1 -XX:ConcGCThreads=1"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - judge0-workers-data:/tmp
      - ./isolate_job.rb:/api/app/jobs/isolate_job.rb
    networks:
      - judge0-network
    restart: unless-stopped

volumes:
  judge0-db-data:
  judge0-redis-data:
  judge0-server-data:
  judge0-workers-data:

networks:
  judge0-network:
    driver: bridge
